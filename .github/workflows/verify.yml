name: Verify Shogi Master
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check shogi.js
          node --check strategy.js
          node --check game-record.js
          node --check engine-config.js
          node --check engine-analysis.js
          node --check analysis-confidence.js
          node --check strategy-events.js
          node --check custom-strategies.js
          node --check strategy-studio.js
          node --check studio-workbench.js
          node --check mobile-controls.js
          node --check narration.js
          node --check engine-vendor/core-worker.js
          node --check engine-vendor/engine-worker.js
      - name: Verify shogi rules and study features
        run: node --test tests/*.test.mjs
      - name: Verify local NNUE engine
        run: node engine-vendor/test-engine.cjs
      - name: Verify site metadata and local resources
        run: node scripts/check-site.mjs
