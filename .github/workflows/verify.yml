name: Verify Shogi Master
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check shogi.js
          node --check strategy.js
          node --check game-record.js
      - name: Verify shogi rules and study features
        run: node --test tests/*.test.mjs
      - name: Verify local NNUE engine
        run: node engine-vendor/test-engine.cjs
      - name: Verify site metadata and local resources
        run: node scripts/check-site.mjs
